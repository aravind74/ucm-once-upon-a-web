<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- Header -->
    <header class="site-header">
      <h1 class="site-title">Luna and the Missing Star</h1>

        </div>

        <!-- Story + activity -->
        <div class="story-column text-column">

          <div id="story-text-5" class="story-text">

          <section id="activity-5" class="activity-card">

            <form id="activity-form-5">
              <input type="text" id="activity-input-5" name="activity-input-5" class="section-control" placeholder="" />

              <button type="button" id="check-answer-5" class="primary-btn">
