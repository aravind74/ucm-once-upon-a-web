<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Luna and the Missing Star – Page 6</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- Header -->
    <header class="site-header">
      <h1 class="site-title">Luna and the Missing Star</h1>
      <div class="site-meta">
        <span class="page-indicator">Page 6 of 7</span>
      </div>
    </header>

    <!-- Main content -->
    <main class="page-content">
      <section class="story-layout">

        <!-- Story + activity -->
        <div class="story-column text-column">
          <h2 id="story-heading-6">Loading story…</h2>

          <div id="story-text-6" class="story-text">
            <!-- Story paragraphs from JSON -->
          </div>

          <section id="activity-6" class="activity-card">
            <h3>Mini Activity</h3>
            <p id="activity-prompt-6"></p>

            <form id="activity-form-6">
              <textarea id="activity-textarea-6" name="activity-textarea-6" rows="4" cols="40"
                placeholder=""></textarea>

              <button type="button" id="check-answer-6" class="primary-btn">
                Submit
              </button>
            </form>

            <p id="activity-feedback-6" class="activity-feedback"></p>
          </section>
        </div>

        <!-- Illustration -->
        <div class="story-column illustration-column">
          <div class="illustration">
            <img src="../assets/page6.png" alt="Luna and her friends looking at the fallen glowing star on the moss" />
          </div>
        </div>

      </section>
    </main>

  </div>
  <!-- Side navigation arrows -->
  <div class="side-nav side-nav-left">
    <a href="storyPage5.html" class="side-nav-link prev" aria-label="Previous page">
      &#10094; <!-- left arrow -->
    </a>
  </div>

  <div class="side-nav side-nav-right">

      &#10095; <!-- right arrow -->
    </a>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../shared.js"></script>
  <script src="../js/storyPage6.js"></script>
</body>

</html>
