<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Luna and the Missing Star – Page 7</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- Header -->
    <header class="site-header">
      <h1 class="site-title">Luna and the Missing Star</h1>
      <div class="site-meta">
        <span class="page-indicator">Page 7 of 7</span>
        <span class="star-counter">⭐ Stars: 0</span>
      </div>
    </header>

    <!-- Main content -->
    <main class="page-content">
      <section class="story-layout">

        <!-- Illustration -->
        <div class="story-column illustration-column">
          <div class="illustration">
            <img src="../assets/page7.png" alt="Luna and her friends sending the star back into the sky" />
          </div>
        </div>

        <!-- Story + activity -->
        <div class="story-column text-column">
          <h2 id="story-heading-7">Loading story…</h2>

          <div id="story-text-7" class="story-text">
            <!-- Story paragraphs injected via JSON -->
          </div>

          <section id="activity-7" class="activity-card">
            <h3>Mini Activity</h3>
            <p id="activity-prompt-7"></p>

            <form id="activity-form-7">
              <div id="star-rating-7" class="star-rating" aria-label="Rate the ending out of 5 stars">
                <button type="button" class="star-icon" data-value="1" aria-label="1 star">★</button>
                <button type="button" class="star-icon" data-value="2" aria-label="2 stars">★</button>
                <button type="button" class="star-icon" data-value="3" aria-label="3 stars">★</button>
                <button type="button" class="star-icon" data-value="4" aria-label="4 stars">★</button>
                <button type="button" class="star-icon" data-value="5" aria-label="5 stars">★</button>
              </div>

              <input type="hidden" id="rating-value-7" value="0" />
              <br />
              <button type="button" id="check-answer-7" class="primary-btn">
                Save Rating
              </button>
            </form>

            <p id="activity-feedback-7" class="activity-feedback"></p>
          </section>
        </div>
      </section>
    </main>

  </div>
  <!-- Side navigation arrows -->
  <div class="side-nav side-nav-left">
    <a href="storyPage6.html" class="side-nav-link prev" aria-label="Previous page">
      &#10094; <!-- left arrow -->
    </a>
  </div>

  <div class="side-nav side-nav-right">
    <a href="starFacts.html" class="side-nav-link next" aria-label="Next page">
      &#10095; <!-- right arrow -->
    </a>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../shared.js"></script>
  <script src="../js/storyPage7.js"></script>
</body>

</html>
