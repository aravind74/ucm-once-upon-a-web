<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Luna and the Missing Star – Page 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- Header -->
    <header class="site-header">
      <h1 class="site-title">Luna and the Missing Star</h1>
      <div class="site-meta">
        <span class="page-indicator">Page 2 of 7</span>
        <span class="star-counter">⭐ Stars: 0</span>
      </div>
    </header>

    <!-- Main content -->
    <main class="page-content">
      <section class="story-layout">

        <!-- Text + activity -->
        <div class="story-column text-column">
          <h2 id="story-heading-2">Loading story…</h2>

          <div id="story-text-2" class="story-text">
            <!-- Injected via JSON -->
          </div>

          <section id="activity-2" class="activity-card">
            <h3>Mini Activity</h3>
            <p id="activity-prompt-2"></p>

            <form id="activity-form-2">
              <div id="activity-options-2" class="activity-options"></div>

              <button type="button" id="check-answer-2" class="primary-btn">
                Check Answer
              </button>
            </form>

            <p id="activity-feedback-2" class="activity-feedback"></p>
          </section>
        </div>

        <!-- Illustration -->
        <div class="story-column illustration-column">
          <div class="illustration">
            <img src="../assets/page2.png" alt="Luna entering the forest with fireflies" />
          </div>
        </div>

      </section>
    </main>

  </div>
  <!-- Side navigation arrows -->
  <div class="side-nav side-nav-left">
    <a href="storyPage1.html" class="side-nav-link prev" aria-label="Previous page">
      &#10094; <!-- left arrow -->
    </a>
  </div>

  <div class="side-nav side-nav-right">
    <a href="storyPage3.html" class="side-nav-link next" aria-label="Next page">
      &#10095; <!-- right arrow -->
    </a>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../shared.js"></script>
  <script src="../js/storyPage2.js"></script>
</body>

</html>
