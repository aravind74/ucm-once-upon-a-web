<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Luna and the Missing Star – Page 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
</head>

<body>
    <div class="page-wrapper">
        <!-- Simple header -->
        <header class="site-header">
            <h1 class="site-title">Luna and the Missing Star</h1>
            <div class="site-meta">
                <span class="page-indicator">Page 1 of 7</span>
                <span class="star-counter">⭐ Stars: 0</span>
            </div>
        </header>

        <!-- Main content area -->
        <main class="page-content">
            <section class="story-layout">
                <!-- Left: illustration -->
                <div class="story-column illustration-column">
                    <div class="illustration">
                        <img src="../assets/page1.png" alt="Luna on the hill looking at the night sky" />
                    </div>
                </div>

                <!-- Right: story + activity -->
                <div class="story-column text-column">
                    <h2 id="story-heading-1">Loading story…</h2>

                    <div id="story-text-1" class="story-text">
                        <!-- Paragraphs from JSON will be injected here -->
                    </div>

                    <section id="activity-1" class="activity-card">
                        <h3>Mini Activity</h3>
                        <p id="activity-prompt-1"></p>

                        <form id="activity-form-1">
                            <div id="activity-options-1" class="activity-options">
                                <!-- Radio buttons will be created here -->
                            </div>
                            <button type="button" id="check-answer-1" class="primary-btn">
                                Check Answer
                            </button>
                        </form>

                        <p id="activity-feedback-1" class="activity-feedback"></p>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <div class="side-nav side-nav-right">
        <a href="storyPage2.html" class="side-nav-link next" aria-label="Next page">
            &#10095; <!-- right arrow -->
        </a>
    </div>


    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../shared.js"></script>
    <script src="../js/storyPage1.js"></script>
</body>

</html>
